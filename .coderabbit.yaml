# CodeRabbit — KontiveHub
# Auto-review em PR + CLI local (`coderabbit review --agent`).
# Docs: https://docs.coderabbit.ai/getting-started/yaml-configuration

language: "pt-BR"

early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  poem: false
  review_status: true
  review_details: true
  collapse_walkthrough: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  assess_linked_issues: true

  path_filters:
    - "!**/vendor/**"
    - "!**/node_modules/**"
    - "!**/.nuxt/**"
    - "!**/.output/**"
    - "!**/dist/**"
    - "!**/pnpm-lock.yaml"
    - "!**/composer.lock"
    - "!**/go.sum"
    - "!**/*.min.js"
    - "!**/*.map"
    - "!**/storage/app/private/**"
    - "!**/.env"
    - "!**/.env.*"
    - "!**/*.pem"
    - "!**/*.pfx"
    - "!**/*.p12"

  path_instructions:
    - path: "apps/api/**"
      instructions: |
        Laravel 13 / PHP 8.4. Controllers orquestram; validação em Form Requests;
        lógica em Actions/Services/DTOs. Tenant via CurrentTenant/membership —
        nunca confiar em tenant_id arbitrário do HTTP. Preserve BelongsToTenant
        fail-closed. Jobs após commit, idempotentes. Sem secrets/XML fiscal/corpo
        de mensagem em logs (use LogSanitizer). Mutações fiscais e kill switches
        são fail-closed. Não invente flags *_ENABLED em defaults.

    - path: "apps/web/**"
      instructions: |
        Nuxt 4 SPA estática, Nuxt UI 4, TypeScript. Clientes HTTP só em
        composables/api (Sanctum cookie). Nunca chamar Wazync/sidecars direto.
        Sem Pinia/SSR sem decisão explícita. Não inventar dados em falha de API.
        UI e textos em pt-BR; identificadores em inglês.

    - path: "apps/wazync/**"
      instructions: |
        Gateway técnico WhatsApp (Go). Sem domínio contábil/negócio. Não expor
        JID cru, protobuf, QR, conteúdo de mensagem ou endpoints no proxy público.
        HMAC/timestamp/nonce/idempotência no contrato Laravel↔Wazync.

    - path: "apps/api/resources/contracts/**"
      instructions: |
        Contratos públicos/privados. Mudança exige testes de compatibilidade nos
        consumidores (API + web e/ou wazync).

    - path: "openspec/**"
      instructions: |
        Specs e changes de produto. Foque em inconsistências com o código e
        gaps de aceite; não reescreva prosa por estilo.

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - master
      - develop
    ignore_title_keywords:
      - "WIP"
      - "DO NOT REVIEW"
      - "[skip review]"

  finishing_touches:
    docstrings:
      enabled: false
    unit_test_generation:
      enabled: false

  tools:
    # Deixa CodeRabbit rodar scanners embutidos; CI do monorepo continua a fonte de verdade
    shellcheck:
      enabled: true
    ruff:
      enabled: false
    markdownlint:
      enabled: false
    github-checks:
      enabled: true
      timeout_ms: 90000

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: auto
  issues:
    scope: auto
  jira:
    usage: auto
  linear:
    usage: auto
  pull_requests:
    scope: auto
