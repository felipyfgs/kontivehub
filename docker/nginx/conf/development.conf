log_format kontivehub_safe 'request_id=$request_id [$time_local] host=$host '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                           'rt=$request_time urt=$upstream_response_time';

server {
    access_log /var/log/nginx/access.log kontivehub_safe;
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 25M;
    server_tokens off;
    absolute_redirect off;

    # Re-resolve upstreams internos quando containers mudam de endereço.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /var/www/frontend;
    index index.html;

    # Laravel API and Sanctum (same-origin)
    location ^~ /api/ {
        try_files $uri @laravel;
    }

    location ^~ /sanctum/ {
        try_files $uri @laravel;
    }

    location ^~ /storage/ {
        try_files $uri @laravel;
    }

    # Reverb/Pusher protocol. O browser usa a mesma origem; o gateway Go
    # permanece somente na rede interna do Compose.
    location ^~ /app/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        # proxy_pass com variável atualiza o endereço quando o cache DNS expira.
        set $reverb_upstream http://reverb:8081;
        proxy_pass $reverb_upstream;
    }

    location ^~ /apps/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $reverb_upstream http://reverb:8081;
        proxy_pass $reverb_upstream;
    }

    location = /up {
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;
        deny all;
        error_page 418 = @laravel;
        return 418;
    }

    # Fortify (views=false): POST/etc → Laravel; GET de páginas SPA → index.html
    location = /login {
        error_page 418 = @laravel;
        if ($request_method != GET) {
            return 418;
        }
        try_files /index.html =404;
    }

    location = /logout {
        try_files $uri @laravel;
    }

    location = /forgot-password {
        error_page 418 = @laravel;
        if ($request_method != GET) {
            return 418;
        }
        try_files /index.html =404;
    }

    location ^~ /reset-password {
        error_page 418 = @laravel;
        if ($request_method != GET) {
            return 418;
        }
        try_files $uri /index.html;
    }

    location = /two-factor-challenge {
        error_page 418 = @laravel;
        if ($request_method != GET) {
            return 418;
        }
        try_files /index.html =404;
    }

    location ^~ /user/ {
        try_files $uri @laravel;
    }

    # Horizon não é exposto pelo edge. Operação e diagnóstico usam Artisan.
    location = /horizon {
        return 404;
    }

    location ^~ /horizon/ {
        return 404;
    }

    location @laravel {
        root /var/www/html/public;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        set $php_upstream api:9000;
        fastcgi_pass $php_upstream;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # PWA: service worker e manifest sem cache longo (atualização confiável)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location ~* ^/(workbox|sw).*\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SPA assets and history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
