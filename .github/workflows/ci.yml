name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Allow only develop to promote into main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "Pull requests into main must come from develop."
            exit 1
          fi

  infrastructure:
    name: Docker manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_KEY: base64:QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
      DB_PASSWORD: ci-database-password
      REDIS_PASSWORD: ci-redis-password
      VAULT_MASTER_KEY: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
      WAZYNC_DATABASE_URL: postgres://wazync:ci@postgres:5432/kontivehub?search_path=wazync&sslmode=disable
      COMMUNICATION_NATS_USER: ci-nats-user
      COMMUNICATION_NATS_PASSWORD: ci-nats-password
      NGINX_EDGE_TOKEN: 1111111111111111111111111111111111111111111111111111111111111111
      KONTIVEHUB_VERSION: sha-ci
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate development and test Compose
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.test.yml config --format json > /tmp/compose-test.json

          jq -e '[.services[].ports[]?] | length == 0' /tmp/compose-test.json >/dev/null
          jq -e '[.services[].volumes[]? | select(.type != "tmpfs")] | length == 0' /tmp/compose-test.json >/dev/null
          jq -e '[.networks[].internal] | all(. == true)' /tmp/compose-test.json >/dev/null
          jq -e '.services["api-test"].build.target == "test"' /tmp/compose-test.json >/dev/null
          jq -e '.services["web-test"].build.target == "test"' /tmp/compose-test.json >/dev/null
          jq -e '.services["wazync-test"].build.target == "test"' /tmp/compose-test.json >/dev/null
          docker compose -f docker-compose.test.yml build --check

      - name: Validate production manifests
        run: |
          docker compose -f docker-compose.prod.yml config --format json > /tmp/compose-prod.json
          docker compose -f docker-compose.swarm.yaml config --format json > /tmp/stack.json
          docker stack config -c docker-compose.swarm.yaml >/dev/null

          jq -e '[.services[].build?] | all(. == null)' /tmp/compose-prod.json >/dev/null
          jq -e '[.services[].volumes[]? | select(.type == "bind")] | length == 0' /tmp/compose-prod.json >/dev/null
          jq -e '[.services[].build?] | all(. == null)' /tmp/stack.json >/dev/null
          jq -e '[.services[].volumes[]? | select(.type == "bind")] | length == 0' /tmp/stack.json >/dev/null
          jq -S '.services | with_entries(.value = .value.image)' /tmp/compose-prod.json > /tmp/compose-images.json
          jq -S '.services | with_entries(.value = .value.image)' /tmp/stack.json > /tmp/stack-images.json
          diff -u /tmp/compose-images.json /tmp/stack-images.json

      - name: Require production credentials
        run: |
          for manifest in docker-compose.prod.yml docker-compose.swarm.yaml; do
            for variable in \
              APP_KEY DB_PASSWORD REDIS_PASSWORD VAULT_MASTER_KEY \
              WAZYNC_DATABASE_URL NGINX_EDGE_TOKEN KONTIVEHUB_VERSION \
              COMMUNICATION_NATS_USER COMMUNICATION_NATS_PASSWORD
            do
              if env "$variable=" docker compose -f "$manifest" config --quiet 2>/dev/null; then
                echo "$manifest aceitou $variable vazia." >&2
                exit 1
              fi
            done
          done

      - name: Reject legacy infrastructure paths
        run: |
          test ! -e Makefile
          test ! -e infra/swarm
          test ! -e infra/docker
          ! git grep -nE 'infra/(docker|swarm)|(^[[:space:]]*(\$[[:space:]]+|[-*][[:space:]]+)?make([[:space:]]|$))|([;&|][[:space:]]*make([[:space:]]|$))|(`make([[:space:]]|$))' -- ':!.github/workflows/ci.yml'

  container-test-images:
    name: Test image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: infrastructure
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
          - image: web
            dockerfile: apps/web/Dockerfile
          - image: wazync
            dockerfile: apps/wazync/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build hermetic test target
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: test
          outputs: type=cacheonly
          cache-from: type=gha,scope=test-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=test-${{ matrix.image }}
          provenance: false

  api:
    name: API (Laravel)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_DATABASE: kontivehub_test
      DB_HOST: 127.0.0.1
      DB_PASSWORD: kontivehub_test
      DB_PORT: 5432
      DB_USERNAME: kontivehub_test
      LOG_CHANNEL: stderr
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kontivehub_test
          POSTGRES_USER: kontivehub_test
          POSTGRES_PASSWORD: kontivehub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kontivehub_test -d kontivehub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: curl, dom, pdo_pgsql, sodium, zip
          coverage: none

      - name: Generate ephemeral application keys
        run: |
          echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"

      - name: Cache Composer packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer manifest
        run: composer validate --strict --no-check-publish

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Map service hostnames
        run: |
          printf '127.0.0.1 postgres-test\n127.0.0.1 redis\n' | sudo tee -a /etc/hosts

      - name: Run tests
        run: php artisan test

  web:
    name: Web (Nuxt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Generate static application
        run: pnpm run generate

      - name: Run tests
        run: pnpm run test

      - name: Scan generated artifacts
        run: pnpm run test:artifacts

  wazync:
    name: Wazync (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/wazync
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: apps/wazync/go.sum

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...
