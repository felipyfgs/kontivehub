# Hot reload is exclusive to the development target.
root = "."
tmp_dir = "/tmp/wazync-air"

[build]
cmd = "go build -o /tmp/wazync-air/wazync ./cmd/wazync"
bin = "/tmp/wazync-air/wazync"
include_ext = ["go", "mod", "sum"]
exclude_dir = [".git"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "2s"

[log]
time = true

[misc]
clean_on_exit = true
