name: ${COMPOSE_PROJECT_NAME:-kontivehub}

x-api-environment: &api-environment
  APP_NAME: ${APP_NAME:-KontiveHub}
  APP_ENV: production
  APP_KEY: ${APP_KEY:?defina APP_KEY no .env}
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:-https://api.example.com}
  FRONTEND_URL: ${FRONTEND_URL:-https://app.example.com}
  PORTAL_URL: ${PORTAL_URL:-https://portal.example.com}
  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  FISCAL_PROFILE: ${FISCAL_PROFILE:-production}
  FISCAL_KILL_SWITCH: ${FISCAL_KILL_SWITCH:-true}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-kontivehub}
  DB_USERNAME: ${DB_USERNAME:-kontivehub}
  DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  SESSION_ENCRYPT: "true"
  SESSION_COOKIE: ${SESSION_COOKIE:-kontivehub_session}
  SESSION_DOMAIN: ${SESSION_DOMAIN:-.example.com}
  SESSION_SECURE_COOKIE: "true"
  SESSION_HTTP_ONLY: "true"
  SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
  QUEUE_CONNECTION: redis
  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
  REVERB_APP_ID: ${REVERB_APP_ID:-communication-disabled}
  REVERB_APP_KEY: ${REVERB_APP_KEY:-communication-disabled}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-communication-disabled}
  REVERB_HOST: reverb
  REVERB_PORT: 8081
  REVERB_SCHEME: http
  REVERB_SERVER_PORT: 8081
  REVERB_SCALING_ENABLED: "true"
  REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-https://app.example.com,https://portal.example.com}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-app.example.com,portal.example.com}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.example.com,https://portal.example.com}
  COMMUNICATION_ENABLED: ${COMMUNICATION_ENABLED:-false}
  COMMUNICATION_FLOWS_ENABLED: ${COMMUNICATION_FLOWS_ENABLED:-false}
  COMMUNICATION_FLOWS_RUNTIME_ENABLED: ${COMMUNICATION_FLOWS_RUNTIME_ENABLED:-false}
  COMMUNICATION_OUTBOUND_CONVERSATION_ENABLED: ${COMMUNICATION_OUTBOUND_CONVERSATION_ENABLED:-false}
  COMMUNICATION_OUTBOUND_CONVERSATION_KILL_SWITCH: ${COMMUNICATION_OUTBOUND_CONVERSATION_KILL_SWITCH:-true}
  ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ASSISTANT_MODEL: ${ASSISTANT_MODEL:-gpt-4o-mini}
  WAZYNC_ENABLED: ${WAZYNC_ENABLED:-false}
  WAZYNC_URL: http://wazync:8080
  WAZYNC_HMAC_KEY_ID: ${WAZYNC_HMAC_KEY_ID:-communication-disabled}
  WAZYNC_HMAC_SECRET: ${WAZYNC_HMAC_SECRET:-communication-disabled}
  WAZYNC_HMAC_PREVIOUS_KEY_ID: ${WAZYNC_HMAC_PREVIOUS_KEY_ID:-}
  WAZYNC_HMAC_PREVIOUS_SECRET: ${WAZYNC_HMAC_PREVIOUS_SECRET:-}
  COMMUNICATION_WHATSAPP_TRANSPORT: ${COMMUNICATION_WHATSAPP_TRANSPORT:-jetstream}
  COMMUNICATION_NATS_URL: ${COMMUNICATION_NATS_URL:-nats://wzap_nats:4222}
  COMMUNICATION_NATS_USER: ${COMMUNICATION_NATS_USER:?defina COMMUNICATION_NATS_USER no .env}
  COMMUNICATION_NATS_PASSWORD: ${COMMUNICATION_NATS_PASSWORD:?defina COMMUNICATION_NATS_PASSWORD no .env}
  COMMUNICATION_NATS_STREAM: ${COMMUNICATION_NATS_STREAM:-KONTIVEHUB_WHATSAPP}
  COMMUNICATION_NATS_EVENT_SUBJECT: ${COMMUNICATION_NATS_EVENT_SUBJECT:-kontivehub.whatsapp.events}
  COMMUNICATION_NATS_COMMAND_SUBJECT: ${COMMUNICATION_NATS_COMMAND_SUBJECT:-kontivehub.whatsapp.commands}
  COMMUNICATION_NATS_EVENT_CONSUMER: ${COMMUNICATION_NATS_EVENT_CONSUMER:-communication-events}
  COMMUNICATION_MEDIA_DISK: communication_media
  COMMUNICATION_MEDIA_DRIVER: ${COMMUNICATION_MEDIA_DRIVER:-local}
  COMMUNICATION_MEDIA_DISK_ROOT: /var/vault/communication
  COMMUNICATION_MEDIA_ENDPOINT: ${COMMUNICATION_MEDIA_ENDPOINT:-http://wzap_minio:9000}
  COMMUNICATION_MEDIA_ACCESS_KEY_ID: ${COMMUNICATION_MEDIA_ACCESS_KEY_ID:-}
  COMMUNICATION_MEDIA_SECRET_ACCESS_KEY: ${COMMUNICATION_MEDIA_SECRET_ACCESS_KEY:-}
  COMMUNICATION_MEDIA_REGION: ${COMMUNICATION_MEDIA_REGION:-us-east-1}
  COMMUNICATION_MEDIA_BUCKET: ${COMMUNICATION_MEDIA_BUCKET:-kontivehub-communication}
  COMMUNICATION_MEDIA_USE_PATH_STYLE_ENDPOINT: "true"
  VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:?defina VAULT_MASTER_KEY no .env}
  VAULT_MASTER_KEY_VERSION: ${VAULT_MASTER_KEY_VERSION:-1}
  VAULT_DISK_ROOT: /var/vault
  RELEASE_SHA: ${KONTIVEHUB_VERSION:?defina KONTIVEHUB_VERSION no .env}

x-api-service: &api-service
  image: ${KONTIVEHUB_REGISTRY:-ghcr.io/felipyfgs/kontivehub}/api:${KONTIVEHUB_VERSION:?defina KONTIVEHUB_VERSION no .env}
  environment: *api-environment
  volumes:
    - vault_data:/var/vault
    - private_storage:/var/www/html/storage/app/private
  restart: unless-stopped
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  networks:
    - app
    - egress
    - gacont

x-wazync-environment: &wazync-environment
  WAZYNC_ENABLED: ${WAZYNC_ENABLED:-false}
  WAZYNC_HTTP_ADDRESS: :8080
  WAZYNC_DATABASE_URL: ${WAZYNC_DATABASE_URL:?defina WAZYNC_DATABASE_URL no .env}
  WAZYNC_EVENT_INGEST_URL: http://nginx:8080/api/internal/v1/communication/gateway/events
  WAZYNC_MEDIA_SOURCE_URL: http://nginx:8080/api/internal/v1/communication/gateway/media
  WAZYNC_HMAC_KEY_ID: ${WAZYNC_HMAC_KEY_ID:-communication-disabled}
  WAZYNC_HMAC_SECRET: ${WAZYNC_HMAC_SECRET:-communication-disabled}
  WAZYNC_HMAC_PREVIOUS_KEY_ID: ${WAZYNC_HMAC_PREVIOUS_KEY_ID:-}
  WAZYNC_HMAC_PREVIOUS_SECRET: ${WAZYNC_HMAC_PREVIOUS_SECRET:-}
  WAZYNC_DATA_KEY: ${WAZYNC_DATA_KEY:-}
  WAZYNC_HMAC_WINDOW: ${WAZYNC_HMAC_WINDOW:-5m}
  WAZYNC_NONCE_TTL: ${WAZYNC_NONCE_TTL:-10m}
  WAZYNC_SESSION_CAPACITY: ${WAZYNC_SESSION_CAPACITY:-250}
  WAZYNC_LEASE_TTL: ${WAZYNC_LEASE_TTL:-2m}
  WAZYNC_HEARTBEAT_EVERY: ${WAZYNC_HEARTBEAT_EVERY:-10s}
  WAZYNC_MEDIA_MAX_BYTES: ${COMMUNICATION_MEDIA_MAX_BYTES:-20971520}
  WAZYNC_WHATSAPP_CONNECT_TIMEOUT: ${WAZYNC_WHATSAPP_CONNECT_TIMEOUT:-20s}
  WAZYNC_WHATSAPP_READY_TIMEOUT: ${WAZYNC_WHATSAPP_READY_TIMEOUT:-30s}
  WAZYNC_WHATSAPP_HTTP_TIMEOUT: ${WAZYNC_WHATSAPP_HTTP_TIMEOUT:-45s}
  WAZYNC_WHATSAPP_PROXY_URL: ${WAZYNC_WHATSAPP_PROXY_URL:-}
  WAZYNC_WHATSAPP_RETRY_HANDLERS: ${WAZYNC_WHATSAPP_RETRY_HANDLERS:-4}
  WAZYNC_NATS_URL: ${COMMUNICATION_NATS_URL:-nats://wzap_nats:4222}
  WAZYNC_NATS_USER: ${COMMUNICATION_NATS_USER:?defina COMMUNICATION_NATS_USER no .env}
  WAZYNC_NATS_PASSWORD: ${COMMUNICATION_NATS_PASSWORD:?defina COMMUNICATION_NATS_PASSWORD no .env}
  WAZYNC_NATS_STREAM: ${COMMUNICATION_NATS_STREAM:-KONTIVEHUB_WHATSAPP}
  WAZYNC_NATS_EVENT_SUBJECT: ${COMMUNICATION_NATS_EVENT_SUBJECT:-kontivehub.whatsapp.events}
  WAZYNC_NATS_COMMAND_SUBJECT: ${COMMUNICATION_NATS_COMMAND_SUBJECT:-kontivehub.whatsapp.commands}
  WAZYNC_NATS_COMMAND_CONSUMER: ${COMMUNICATION_NATS_COMMAND_CONSUMER:-wazync-commands}

services:
  nginx:
    image: ${KONTIVEHUB_REGISTRY:-ghcr.io/felipyfgs/kontivehub}/nginx:${KONTIVEHUB_VERSION:?defina KONTIVEHUB_VERSION no .env}
    environment:
      NGINX_EDGE_TOKEN: ${NGINX_EDGE_TOKEN:?defina NGINX_EDGE_TOKEN no .env}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      reverb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    cpus: 0.50
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - app

  web:
    image: ${KONTIVEHUB_REGISTRY:-ghcr.io/felipyfgs/kontivehub}/web:${KONTIVEHUB_VERSION:?defina KONTIVEHUB_VERSION no .env}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 0.50
    security_opt:
      - no-new-privileges:true
    networks:
      - app

  api:
    <<: *api-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',9000); exit($$s ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    cpus: 1.50

  horizon:
    <<: *api-service
    image: ${KONTIVEHUB_REGISTRY:-ghcr.io/felipyfgs/kontivehub}/api-rpa:${KONTIVEHUB_VERSION:?defina KONTIVEHUB_VERSION no .env}
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "gosu www-data php artisan horizon:status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 3g
    cpus: 2.00

  scheduler:
    <<: *api-service
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$path='/tmp/kontivehub-scheduler-heartbeat'; $$now=time(); $$mtime=@filemtime($$path); exit($$mtime !== false && $$mtime <= $$now && $$now - $$mtime <= 180 ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 768m
    cpus: 1.00

  communication-events:
    <<: *api-service
    command: ["php", "artisan", "communication:consume-gateway-events"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$path='/tmp/kontivehub-communication-events-heartbeat'; $$now=time(); $$mtime=@filemtime($$path); exit($$mtime !== false && $$mtime <= $$now && $$now - $$mtime <= 90 ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    cpus: 0.50

  reverb:
    <<: *api-service
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8081"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',8081); exit($$s ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: 1.00

  wazync:
    image: ${KONTIVEHUB_REGISTRY:-ghcr.io/felipyfgs/kontivehub}/wazync:${KONTIVEHUB_VERSION:?defina KONTIVEHUB_VERSION no .env}
    environment: *wazync-environment
    volumes:
      - wazync_spool:/var/lib/wazync/spool
    depends_on:
      postgres:
        condition: service_healthy
      nginx:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 768m
    cpus: 1.00
    security_opt:
      - no-new-privileges:true
    networks:
      - app
      - egress
      - gacont

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kontivehub}
      POSTGRES_USER: ${DB_USERNAME:-kontivehub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 2g
    cpus: 2.00
    security_opt:
      - no-new-privileges:true
    networks:
      - app

  redis:
    image: redis:8-alpine
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf 'appendonly yes\nrequirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 768m
    cpus: 1.00
    security_opt:
      - no-new-privileges:true
    networks:
      - app

volumes:
  postgres_data:
  redis_data:
  vault_data:
  private_storage:
  wazync_spool:

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
    internal: true
  egress:
    driver: bridge
  gacont:
    external: true
    name: ${GACONT_NETWORK:-Gacont}
