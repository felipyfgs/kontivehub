name: ${COMPOSE_PROJECT_NAME:-kontivehub}

x-api-environment: &api-environment
  APP_NAME: ${APP_NAME:-KontiveHub}
  APP_ENV: ${APP_ENV:-local}
  APP_KEY: ${APP_KEY:?copie .env.example para .env e defina APP_KEY}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: ${APP_URL:-http://localhost:8080}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  PORTAL_URL: ${PORTAL_URL:-http://localhost:3000}
  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  FISCAL_PROFILE: ${FISCAL_PROFILE:-dev}
  FISCAL_KILL_SWITCH: ${FISCAL_KILL_SWITCH:-false}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-kontivehub}
  DB_USERNAME: ${DB_USERNAME:-kontivehub}
  DB_PASSWORD: ${DB_PASSWORD:-kontivehub-local}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  SESSION_ENCRYPT: ${SESSION_ENCRYPT:-true}
  QUEUE_CONNECTION: redis
  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
  REVERB_APP_ID: ${REVERB_APP_ID:-communication-disabled}
  REVERB_APP_KEY: ${REVERB_APP_KEY:-communication-disabled}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-communication-disabled}
  REVERB_HOST: reverb
  REVERB_PORT: 8081
  REVERB_SCHEME: http
  REVERB_SERVER_PORT: 8081
  REVERB_SCALING_ENABLED: "true"
  REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:3000}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost,localhost:8080,localhost:3000,127.0.0.1,127.0.0.1:8080,127.0.0.1:3000}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:3000}
  COMMUNICATION_ENABLED: ${COMMUNICATION_ENABLED:-false}
  COMMUNICATION_FLOWS_ENABLED: ${COMMUNICATION_FLOWS_ENABLED:-false}
  COMMUNICATION_FLOWS_RUNTIME_ENABLED: ${COMMUNICATION_FLOWS_RUNTIME_ENABLED:-false}
  COMMUNICATION_OUTBOUND_CONVERSATION_ENABLED: ${COMMUNICATION_OUTBOUND_CONVERSATION_ENABLED:-false}
  COMMUNICATION_OUTBOUND_CONVERSATION_KILL_SWITCH: ${COMMUNICATION_OUTBOUND_CONVERSATION_KILL_SWITCH:-true}
  ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ASSISTANT_MODEL: ${ASSISTANT_MODEL:-gpt-4o-mini}
  WAZYNC_ENABLED: ${WAZYNC_ENABLED:-false}
  WAZYNC_URL: http://wazync:8080
  WAZYNC_HMAC_KEY_ID: ${WAZYNC_HMAC_KEY_ID:-}
  WAZYNC_HMAC_SECRET: ${WAZYNC_HMAC_SECRET:-}
  WAZYNC_HMAC_PREVIOUS_KEY_ID: ${WAZYNC_HMAC_PREVIOUS_KEY_ID:-}
  WAZYNC_HMAC_PREVIOUS_SECRET: ${WAZYNC_HMAC_PREVIOUS_SECRET:-}
  COMMUNICATION_WHATSAPP_TRANSPORT: ${COMMUNICATION_WHATSAPP_TRANSPORT:-jetstream}
  COMMUNICATION_NATS_URL: ${COMMUNICATION_NATS_URL:-nats://nats:4222}
  COMMUNICATION_NATS_USER: ${COMMUNICATION_NATS_USER:-}
  COMMUNICATION_NATS_PASSWORD: ${COMMUNICATION_NATS_PASSWORD:-}
  COMMUNICATION_NATS_STREAM: ${COMMUNICATION_NATS_STREAM:-KONTIVEHUB_WHATSAPP}
  COMMUNICATION_NATS_EVENT_SUBJECT: ${COMMUNICATION_NATS_EVENT_SUBJECT:-kontivehub.whatsapp.events}
  COMMUNICATION_NATS_COMMAND_SUBJECT: ${COMMUNICATION_NATS_COMMAND_SUBJECT:-kontivehub.whatsapp.commands}
  COMMUNICATION_NATS_EVENT_CONSUMER: ${COMMUNICATION_NATS_EVENT_CONSUMER:-communication-events}
  COMMUNICATION_MEDIA_DISK: communication_media
  COMMUNICATION_MEDIA_DRIVER: ${COMMUNICATION_MEDIA_DRIVER:-local}
  COMMUNICATION_MEDIA_DISK_ROOT: /var/vault/communication
  COMMUNICATION_MEDIA_ENDPOINT: ${COMMUNICATION_MEDIA_ENDPOINT:-http://minio:9000}
  COMMUNICATION_MEDIA_ACCESS_KEY_ID: ${COMMUNICATION_MEDIA_ACCESS_KEY_ID:-kontivehub-local}
  COMMUNICATION_MEDIA_SECRET_ACCESS_KEY: ${COMMUNICATION_MEDIA_SECRET_ACCESS_KEY:-kontivehub-local-secret}
  COMMUNICATION_MEDIA_REGION: ${COMMUNICATION_MEDIA_REGION:-us-east-1}
  COMMUNICATION_MEDIA_BUCKET: ${COMMUNICATION_MEDIA_BUCKET:-kontivehub-communication}
  COMMUNICATION_MEDIA_USE_PATH_STYLE_ENDPOINT: "true"
  VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:?defina VAULT_MASTER_KEY no .env}
  VAULT_MASTER_KEY_VERSION: ${VAULT_MASTER_KEY_VERSION:-1}
  VAULT_DISK_ROOT: /var/vault
  DEVELOPMENT_DATA_PATH: /var/www/html/.local/dados
  DEVELOPMENT_PLATFORM_ADMIN_EMAIL: ${DEVELOPMENT_PLATFORM_ADMIN_EMAIL:-platform@example.com}
  DEVELOPMENT_PLATFORM_ADMIN_PASSWORD: ${DEVELOPMENT_PLATFORM_ADMIN_PASSWORD:-password}
  DEVELOPMENT_TENANT_ADMIN_EMAIL: ${DEVELOPMENT_TENANT_ADMIN_EMAIL:-admin@example.com}
  DEVELOPMENT_TENANT_ADMIN_PASSWORD: ${DEVELOPMENT_TENANT_ADMIN_PASSWORD:-password}
  LOCAL_UID: ${LOCAL_UID:-1000}
  LOCAL_GID: ${LOCAL_GID:-1000}
  COMPOSER_HOME: /tmp/composer

x-api-service: &api-service
  image: ${COMPOSE_PROJECT_NAME:-kontivehub}-api:dev
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: runtime
  environment: *api-environment
  volumes:
    - ./apps/api:/var/www/html
    - ./.local/dados:/var/www/html/.local/dados:ro
    - vault_data:/var/vault
    - private_storage:/var/www/html/storage/app/private
  restart: unless-stopped
  networks:
    - app

services:
  nginx:
    image: ${COMPOSE_PROJECT_NAME:-kontivehub}-nginx:dev
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      target: development
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    volumes:
      - ./apps/api:/var/www/html:ro
      - ./apps/web/.output/public:/var/www/frontend:ro
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      reverb:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --header='Accept: application/json' -qO- http://127.0.0.1/up | grep -q '\"status\":\"up\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app

  api-prepare:
    <<: *api-service
    command: ["true"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    <<: *api-service
    depends_on:
      api-prepare:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "gosu www-data php artisan about --only=environment >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  horizon:
    <<: *api-service
    image: ${COMPOSE_PROJECT_NAME:-kontivehub}-api-rpa:dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: rpa-runtime
    command: ["php", "artisan", "horizon"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *api-service
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  communication-events:
    <<: *api-service
    command: ["php", "artisan", "communication:consume-gateway-events"]
    depends_on:
      api:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$path='/tmp/kontivehub-communication-events-heartbeat'; $$now=time(); $$mtime=@filemtime($$path); exit($$mtime !== false && $$mtime <= $$now && $$now - $$mtime <= 90 ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  reverb:
    <<: *api-service
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8081"]
    expose:
      - "8081"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',8081); exit($$s ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ${COMPOSE_PROJECT_NAME:-kontivehub}-web:dev
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    working_dir: /app
    volumes:
      - ./apps/web:/app
      - ./apps/api/resources/contracts:/workspace/api-contracts:ro
      - ./apps/api/app/Services/FiscalMonitoring/Surfaces:/workspace/api-monitoring-surfaces:ro
      - ./docker/nginx:/workspace/nginx:ro
      - web_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_DEV_PORT:-3000}:3000"
    environment:
      LOCAL_UID: ${LOCAL_UID:-1000}
      LOCAL_GID: ${LOCAL_GID:-1000}
      PNPM_CONFIG_STORE_DIR: ${PNPM_CONFIG_STORE_DIR:-}
      NUXT_SANCTUM_PROXY: "true"
      NUXT_SANCTUM_PROXY_BASE: http://nginx
      NUXT_DEVTOOLS: ${NUXT_DEVTOOLS:-true}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      HOST: 0.0.0.0
      FRONTEND_DEV_PORT: ${FRONTEND_DEV_PORT:-3000}
      NUXT_DEV_HMR_HOST: ${PUBLIC_HOST:-}
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      NUXT_PUBLIC_COMMUNICATION_ENABLED: ${COMMUNICATION_ENABLED:-false}
      NUXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY:-communication-disabled}
      NUXT_PUBLIC_REVERB_HOST: ${PUBLIC_HOST:-localhost}
      NUXT_PUBLIC_REVERB_PORT: ${APP_PORT:-8080}
      NUXT_PUBLIC_REVERB_SCHEME: http
    init: true
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kontivehub}
      POSTGRES_USER: ${DB_USERNAME:-kontivehub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kontivehub-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - app

  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: kontivehub_test
      POSTGRES_USER: kontivehub_test
      POSTGRES_PASSWORD: kontivehub_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kontivehub_test -d kontivehub_test"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: "no"
    networks:
      - app

  wazync-db-init:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/opt/kontivehub/init-wazync.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${DB_DATABASE:-kontivehub}
      POSTGRES_USER: ${DB_USERNAME:-kontivehub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kontivehub-local}
      WAZYNC_DB_USER: ${WAZYNC_DB_USER:-wazync}
      WAZYNC_DB_PASSWORD: ${WAZYNC_DB_PASSWORD:-wazync-local}
    volumes:
      - ./apps/wazync/docker/init-db.sh:/opt/kontivehub/init-wazync.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - app

  wazync:
    image: ${COMPOSE_PROJECT_NAME:-kontivehub}-wazync:dev
    build:
      context: .
      dockerfile: apps/wazync/Dockerfile
      target: development
    environment:
      WAZYNC_ENABLED: ${WAZYNC_ENABLED:-false}
      WAZYNC_DATABASE_URL: ${WAZYNC_DATABASE_URL:-postgres://wazync:wazync-local@postgres:5432/kontivehub?search_path=wazync&sslmode=disable}
      WAZYNC_EVENT_INGEST_URL: http://nginx/api/internal/v1/communication/gateway/events
      WAZYNC_MEDIA_SOURCE_URL: http://nginx/api/internal/v1/communication/gateway/media
      WAZYNC_HMAC_KEY_ID: ${WAZYNC_HMAC_KEY_ID:-}
      WAZYNC_HMAC_SECRET: ${WAZYNC_HMAC_SECRET:-}
      WAZYNC_HMAC_PREVIOUS_KEY_ID: ${WAZYNC_HMAC_PREVIOUS_KEY_ID:-}
      WAZYNC_HMAC_PREVIOUS_SECRET: ${WAZYNC_HMAC_PREVIOUS_SECRET:-}
      WAZYNC_DATA_KEY: ${WAZYNC_DATA_KEY:-}
      WAZYNC_HMAC_WINDOW: ${WAZYNC_HMAC_WINDOW:-5m}
      WAZYNC_NONCE_TTL: ${WAZYNC_NONCE_TTL:-10m}
      WAZYNC_SESSION_CAPACITY: ${WAZYNC_SESSION_CAPACITY:-250}
      WAZYNC_LEASE_TTL: ${WAZYNC_LEASE_TTL:-2m}
      WAZYNC_HEARTBEAT_EVERY: ${WAZYNC_HEARTBEAT_EVERY:-10s}
      WAZYNC_MEDIA_MAX_BYTES: ${COMMUNICATION_MEDIA_MAX_BYTES:-20971520}
      WAZYNC_WHATSAPP_CONNECT_TIMEOUT: ${WAZYNC_WHATSAPP_CONNECT_TIMEOUT:-20s}
      WAZYNC_WHATSAPP_READY_TIMEOUT: ${WAZYNC_WHATSAPP_READY_TIMEOUT:-30s}
      WAZYNC_WHATSAPP_HTTP_TIMEOUT: ${WAZYNC_WHATSAPP_HTTP_TIMEOUT:-45s}
      WAZYNC_WHATSAPP_PROXY_URL: ${WAZYNC_WHATSAPP_PROXY_URL:-}
      WAZYNC_WHATSAPP_RETRY_HANDLERS: ${WAZYNC_WHATSAPP_RETRY_HANDLERS:-4}
      WAZYNC_NATS_URL: ${COMMUNICATION_NATS_URL:-nats://nats:4222}
      WAZYNC_NATS_USER: ${COMMUNICATION_NATS_USER:-}
      WAZYNC_NATS_PASSWORD: ${COMMUNICATION_NATS_PASSWORD:-}
      WAZYNC_NATS_STREAM: ${COMMUNICATION_NATS_STREAM:-KONTIVEHUB_WHATSAPP}
      WAZYNC_NATS_EVENT_SUBJECT: ${COMMUNICATION_NATS_EVENT_SUBJECT:-kontivehub.whatsapp.events}
      WAZYNC_NATS_COMMAND_SUBJECT: ${COMMUNICATION_NATS_COMMAND_SUBJECT:-kontivehub.whatsapp.commands}
      WAZYNC_NATS_COMMAND_CONSUMER: ${COMMUNICATION_NATS_COMMAND_CONSUMER:-wazync-commands}
    volumes:
      - ./apps/wazync:/src/apps/wazync
      - wazync_spool:/var/lib/wazync/spool
    expose:
      - "8080"
    depends_on:
      wazync-db-init:
        condition: service_completed_successfully
      nginx:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - app

  nats:
    image: nats:2-alpine
    command: ["--http_port=8222", "--js", "--store_dir=/data"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - app

  minio:
    image: quay.io/minio/minio:RELEASE.2024-01-13T07-53-03Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${COMMUNICATION_MEDIA_ACCESS_KEY_ID:-kontivehub-local}
      MINIO_ROOT_PASSWORD: ${COMMUNICATION_MEDIA_SECRET_ACCESS_KEY:-kontivehub-local-secret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9000' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - app

  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-01-11T05-49-32Z
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set communication http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "communication/$$MINIO_BUCKET"
        mc anonymous set none "communication/$$MINIO_BUCKET"
    environment:
      MINIO_ROOT_USER: ${COMMUNICATION_MEDIA_ACCESS_KEY_ID:-kontivehub-local}
      MINIO_ROOT_PASSWORD: ${COMMUNICATION_MEDIA_SECRET_ACCESS_KEY:-kontivehub-local-secret}
      MINIO_BUCKET: ${COMMUNICATION_MEDIA_BUCKET:-kontivehub-communication}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - app

volumes:
  postgres_data:
  redis_data:
  vault_data:
  private_storage:
  web_node_modules:
  wazync_spool:
  nats_data:
  minio_data:

networks:
  app:
    driver: bridge
