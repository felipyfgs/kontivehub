log_format kontivehub_safe 'request_id=$request_id [$time_local] host=$host '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                           'rt=$request_time urt=$upstream_response_time';

server {
    access_log /var/log/nginx/access.log kontivehub_safe;
    listen 80 default_server;
    server_name app.kontivehub.com.br portal.kontivehub.com.br;
    charset utf-8;
    client_max_body_size 25M;
    server_tokens off;
    absolute_redirect off;

    # Única origem de proxy confiável: IP fixo do Traefik na rede edge.
    # O Traefik sanitiza X-Forwarded-For de clientes não confiáveis.
    set_real_ip_from 172.31.255.2;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    location = /up {
        deny all;
    }

    location = /horizon {
        deny all;
    }

    location ^~ /horizon/ {
        deny all;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location ~* ^/(workbox|sw).*\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

server {
    access_log /var/log/nginx/access.log kontivehub_safe;
    listen 80;
    server_name api.kontivehub.com.br;
    charset utf-8;
    client_max_body_size 25M;
    server_tokens off;
    absolute_redirect off;

    set_real_ip_from 172.31.255.2;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Re-resolve upstreams internos quando containers mudam de endereço.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ^~ /api/ { try_files $uri @laravel; }
    location ^~ /sanctum/ { try_files $uri @laravel; }
    location ^~ /storage/ { try_files $uri @laravel; }
    location ^~ /user/ { try_files $uri @laravel; }
    location ^~ /email/ { try_files $uri @laravel; }
    location ^~ /reset-password { try_files $uri @laravel; }
    location ^~ /broadcasting/ { try_files $uri @laravel; }
    location = /login { try_files $uri @laravel; }
    location = /logout { try_files $uri @laravel; }
    location = /forgot-password { try_files $uri @laravel; }
    location = /two-factor-challenge { try_files $uri @laravel; }

    location ^~ /app/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        # proxy_pass com variável atualiza o endereço quando o cache DNS expira.
        set $reverb_upstream http://reverb:8081;
        proxy_pass $reverb_upstream;
    }

    location ^~ /apps/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        set $reverb_upstream http://reverb:8081;
        proxy_pass $reverb_upstream;
    }

    location = /up {
        deny all;
    }

    location = /horizon {
        deny all;
    }

    location ^~ /horizon/ {
        deny all;
    }

    location @laravel {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location / {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
