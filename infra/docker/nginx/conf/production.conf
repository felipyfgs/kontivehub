log_format kontivehub_safe 'request_id=$request_id [$time_local] host=$host '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                           'rt=$request_time urt=$upstream_response_time';

map_hash_bucket_size 128;
map $http_x_kontivehub_edge_token $kontivehub_edge_authorized {
    default 0;
    "__KONTIVEHUB_EDGE_TOKEN__" 1;
}

server {
    access_log /var/log/nginx/access.log kontivehub_safe;
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 25M;
    server_tokens off;
    absolute_redirect off;
    # Não permita que os arquivos de boas-vindas da imagem base satisfaçam
    # try_files; todo conteúdo da SPA pertence ao serviço web.
    root /var/empty;

    # O routing mesh publica esta porta em todos os nós. Somente o edge que
    # conhece o token montado por Docker Secret pode atravessá-la.
    if ($kontivehub_edge_authorized = 0) {
        return 421;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    location ^~ /api/internal/ {
        return 404;
    }

    location ^~ /api/ {
        try_files $uri @laravel;
    }

    location ^~ /sanctum/ {
        try_files $uri @laravel;
    }

    location ^~ /storage/ {
        try_files $uri @laravel;
    }

    location ^~ /app/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-KontiveHub-Edge-Token "";
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        set $reverb_upstream http://reverb:8081;
        proxy_pass $reverb_upstream;
    }

    location ^~ /apps/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-KontiveHub-Edge-Token "";
        set $reverb_upstream http://reverb:8081;
        proxy_pass $reverb_upstream;
    }

    location = /up {
        try_files $uri @laravel;
    }

    location = /login {
        error_page 418 = @laravel;
        if ($request_method != GET) {
            return 418;
        }
        try_files $uri @web;
    }

    location = /logout {
        try_files $uri @laravel;
    }

    location = /forgot-password {
        error_page 418 = @laravel;
        if ($request_method != GET) {
            return 418;
        }
        try_files $uri @web;
    }

    location ^~ /reset-password {
        error_page 418 = @laravel;
        if ($request_method != GET) {
            return 418;
        }
        try_files $uri @web;
    }

    location = /two-factor-challenge {
        error_page 418 = @laravel;
        if ($request_method != GET) {
            return 418;
        }
        try_files $uri @web;
    }

    location ^~ /user/ {
        try_files $uri @laravel;
    }

    location = /horizon {
        return 404;
    }

    location ^~ /horizon/ {
        return 404;
    }

    location @laravel {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Em produção este proxy recebe somente tráfego HTTP interno do
        # terminador TLS. Laravel deve enxergar a requisição pública como HTTPS.
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_KONTIVEHUB_EDGE_TOKEN "";
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location @web {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-KontiveHub-Edge-Token "";
        set $web_upstream http://web:80;
        proxy_pass $web_upstream;
    }

    location / {
        try_files $uri @web;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# Listener exclusivo da rede overlay interna. Não é publicado pelo Swarm e
# expõe apenas o healthcheck e os endpoints HMAC usados pelo Wazync.
server {
    access_log off;
    listen 8080;
    server_name _;
    server_tokens off;
    root /var/empty;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /nginx-health {
        return 204;
    }

    location = /up {
        try_files $uri @internal_laravel;
    }

    location ^~ /api/internal/ {
        try_files $uri @internal_laravel;
    }

    location @internal_laravel {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS off;
        fastcgi_param HTTP_X_FORWARDED_PROTO http;
        fastcgi_param HTTP_X_KONTIVEHUB_EDGE_TOKEN "";
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location / {
        return 404;
    }
}
