# O agente principal herda modelo/esforço da configuração global ou do perfil
# selecionado, e continua livre para trocar ambos com `/model`. Os subagentes
# mantêm o roteamento econômico específico deste repositório.

[agents]
enabled = true
max_concurrent_threads_per_session = 6
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "high"
interrupt_message = true

