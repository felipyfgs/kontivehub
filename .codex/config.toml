# O principal herda modelo/esforço da sessão. Terra é o fallback nativo
# compatível; Luna atende exploração/review pelo perfil ou leaf-agent.

[agents]
enabled = true
max_concurrent_threads_per_session = 6
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
interrupt_message = true
