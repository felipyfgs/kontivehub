schema: spec-driven

context: |
  Projeto e produto
  - KontiveHub é uma plataforma SaaS multi-tenant para escritórios contábeis.
    O agregado de tenancy é `Tenant`; usuários acessam tenants por memberships.
  - Os principais domínios são identidade e plataforma, clientes e
    estabelecimentos, fiscal/documental, SERPRO/Integra Contador, SEFAZ/ADN,
    FGTS/eSocial/MEI, monitoramento, trabalho operacional (`Work`), comunicação
    e assistência.
  - Identificadores de código e termos oficiais de integração usam inglês;
    interface, propostas e documentação de produto usam pt-BR.

  Monorepo e ownership
  - `apps/api` é a API Laravel `/api/v1` e a dona do domínio, persistência,
    autorização, políticas multi-tenant, integrações, jobs e comunicação de
    negócio.
  - `apps/web` é a SPA/PWA Nuxt que apresenta os fluxos da API. Clientes HTTP
    ficam em `app/composables/api`; a SPA não acessa bancos, Wazync ou sidecars
    diretamente.
  - `apps/wazync` é somente o gateway técnico de WhatsApp: protocolo WhatsMeow,
    sessões, pareamento, transporte, spool e persistência técnica. Regras de
    atendimento e automação de negócio permanecem no Laravel.
  - `apps/api/resources/contracts/public.openapi.json` é o contrato público
    canônico consumido pela SPA e gera
    `apps/web/app/types/generated/public-api.ts`.
  - `apps/api/resources/contracts/wazync.openapi.yaml` é o contrato privado
    Laravel-Wazync. Mudá-lo exige compatibilidade e testes nos dois consumidores.
  - `infra/docker`, `docker-compose*.yml` e `Makefile` definem desenvolvimento,
    testes e runtime. `openspec` contém mudanças, delta specs, tarefas e specs
    canônicas; não recriar o layout `/docs`.

  Stack
  - API: PHP 8.4, Laravel 13, Fortify, Sanctum por cookie, Horizon, Reverb,
    PHPUnit 12 e Pint.
  - `apps/api/rpa/fgts_digital` contém um worker Python empacotado na imagem PHP
    para o adapter FGTS Digital. Ele é acionado e governado pelo Laravel,
    testado com fixtures e não constitui um serviço de domínio independente.
  - Dados/runtime: PostgreSQL 17 em runtime e testes; Redis 8 para cache, filas
    e sessão; PHP-FPM, scheduler e Horizon executam em containers próprios.
  - Web: Nuxt 4/Vue 3, Nuxt UI 4, TypeScript 6, pnpm 11, Tailwind CSS 4,
    Vitest e Playwright. É SPA estática (`ssr: false`, `nuxt generate`) e PWA.
  - Wazync: Go 1.25, WhatsMeow, pgx/PostgreSQL e HTTP interno.
  - Ambiente local e gates devem usar Make/Docker Compose quando houver fluxo
    containerizado equivalente; não instalar dependências diretamente no host.

  Arquitetura Laravel
  - Controllers orquestram apenas. Validação/autorização ficam em Form Requests
    e Policies/Gates; workflows e transações ficam em Actions/Services; dados
    atravessam DTOs e respostas usam Resources ou transformers versionados.
  - Integrações externas dependem de contratos/ports próprios e adapters
    configurados no container. SDK, HTTP, cURL e credenciais não se espalham por
    controllers, models ou domínio.
  - O domínio `Work` nunca chama SERPRO, ADN ou SEFAZ.
  - Operações com múltiplas escritas usam transação. Jobs, eventos e efeitos
    externos observáveis saem após commit e devem ser idempotentes, seguros para
    retry e observáveis.
  - Migrations já compartilhadas são imutáveis. Toda mudança de schema usa uma
    migration nova, reversível e compatível com PostgreSQL, preservando chaves e
    índices com `tenant_id`.

  Tenancy e autorização
  - O tenant corrente é resolvido por `App\Support\CurrentTenant` a partir do
    usuário autenticado e de membership válida. Nunca confiar em `tenant_id`
    arbitrário recebido por HTTP.
  - Models tenant-scoped usam `BelongsToTenant`, cujo global scope é fail-closed
    quando não existe tenant ativo.
  - Bypass de scope exige identificador confiável ou contexto privilegiado
    tipado. Administração global usa ator real, flag explícita e auditoria; nunca
    fabricar membership para contornar Policies.
  - Mudanças devem testar sucesso, autorização negada, membership ausente e
    isolamento cross-tenant.

  Contratos e compatibilidade
  - Preservar contratos publicados de `/api/v1`: URI, campos, envelopes, status
    HTTP, paginação, códigos de erro e semântica. Evolução deve ser aditiva ou
    explicitamente versionada e coberta por testes de compatibilidade.
  - O frontend usa Sanctum stateful por cookie, CSRF e `useSanctumClient`.
    CORS, Sanctum e Reverb usam allowlists explícitas; wildcard não é correção
    aceitável.
  - O Wazync expõe somente endpoints internos. Preservar HMAC, timestamp, nonce,
    idempotência e rotação de chave; não expor JIDs crus, protobufs, QR, conteúdo
    de mensagens, media ou métricas do gateway no proxy público.

  Segurança, dados e rollout
  - Mutações fiscais, egress real, automações e rollout são fail-closed. Nunca
    habilitar `*_ENABLED`, `ALLOW_ALL_*`, capabilities reais nem desligar kill
    switches em exemplos ou testes sem autorização e plano explícito.
  - Não versionar, ler para documentação nem imprimir `.env`, `.env.prod`,
    `auth.json`, tokens, PFX/PEM, certificados, chaves, vault, backups,
    spool/sessões WhatsApp ou `storage/app/private`.
  - Logs e métricas nunca incluem XML fiscal, corpo de mensagem, chave de
    acesso, CNPJ completo, credenciais ou payload bruto. Usar
    `App\Support\LogSanitizer`, referências opacas e labels de baixa cardinalidade.
  - Não executar comandos de produção, restore, go-live ou smoke real sem
    autorização explícita e ambiente validado.

  Frontend
  - Reutilizar Nuxt UI e os componentes, composables, tipos e arquétipos
    existentes. Vue/TypeScript usa 2 espaços, sem ponto e vírgula e sem vírgula
    final.
  - Não introduzir SSR ou Pinia sem decisão arquitetural explícita.
  - A SPA não inventa dados ou estados sintéticos quando a API falha e não cria
    fallback direto para serviços internos.

  Wazync
  - Código Go usa `gofmt`. Persistência, sessão, leases, spool, comandos,
    queries, eventos e media são responsabilidades técnicas do gateway.
  - O Laravel chama Wazync pelo contrato privado; Wazync devolve eventos ao
    Laravel. Ambos os sentidos permanecem autenticados e internos.
  - Wazync não contém domínio fiscal, UI Nuxt nem regras de comunicação de
    negócio.

  Desenvolvimento e qualidade
  - Antes de editar um app, ler o `AGENTS.md` da raiz e o `AGENTS.md` mais
    próximo. Preservar mudanças locais e arquivos não relacionados do usuário.
  - Mudança não trivial requer uma change em `openspec/changes` antes da
    implementação, com testes junto ao comportamento, salvo dispensa explícita.
  - API: `composer validate --strict --no-check-publish`,
    `vendor/bin/pint --test` e `php artisan test`, executados na stack deste
    checkout.
  - Web: `pnpm run lint`, `pnpm run typecheck`, `pnpm run generate`,
    `pnpm run test`, `pnpm run test:fidelity` e `pnpm run test:artifacts` no
    container `frontend-dev`. Playwright E2E é validação local adicional.
  - Wazync: `make wazync-test`, que executa `go test ./...` e `go vet ./...` via
    Docker.
  - Não há CI versionado; os comandos acima, os testes e os `AGENTS.md` são a
    fonte de verdade dos gates.

  Uso brownfield do OpenSpec
  - Não fazer backfill de toda a codebase. Specs crescem delta-first: documentar
    somente o comportamento tocado por uma mudança real e incorporar as delta
    specs às specs canônicas ao arquivar.
  - Antes de propor, verificar mudanças ativas e ler os artefatos relacionados.
    Não descrever comportamento planejado como se já estivesse implementado.
  - Capabilities devem representar áreas de comportamento coesas e estáveis, não
    diretórios, classes isoladas ou tarefas de refactor.

rules:
  proposal:
    - Escrever em pt-BR e manter nomes de código, integrações e capabilities nos termos oficiais.
    - Explicar por que a mudança é necessária, quais comportamentos mudam e quais ficam explicitamente fora do escopo.
    - Identificar apps, domínios, contratos, migrations, filas, flags e consumidores afetados; declarar riscos de compatibilidade e egress.
    - Distinguir capabilities novas das já existentes em `openspec/specs`; não tratar ausência de baseline brownfield como motivo para backfill.
  design:
    - Fundamentar decisões em paths e padrões reais do repositório e registrar alternativas e trade-offs relevantes.
    - Explicitar tenancy, autorização, dados sensíveis, transações, idempotência, retry, observabilidade, rollout e rollback quando aplicáveis.
    - Em mudanças multi-app, descrever ownership e os contratos entre Laravel, Nuxt e Wazync sem deslocar responsabilidades de domínio.
  specs:
    - Escrever requisitos comportamentais testáveis com SHALL e ao menos um cenário WHEN/THEN por requisito.
    - Preservar isolamento tenant, fail-closed, contratos públicos e fronteiras internas; mudanças de contrato exigem cenários de compatibilidade.
    - Evitar detalhes incidentais de implementação, salvo quando constituírem uma restrição arquitetural ou de segurança observável.
  tasks:
    - Dividir a implementação por boundary e app, com testes focados antes dos gates completos correspondentes.
    - Incluir compatibilidade de contratos nos dois consumidores, migration reversível, after-commit, idempotência e segurança quando aplicáveis.
    - Não incluir habilitação de produção, egress real, limpeza destrutiva, restore ou alteração de segredos como tarefa padrão.
